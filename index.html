<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chá de Bebê</title>
<meta name="theme-color" content="#F7F4F8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💕</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=10">
<script type="module" src="js/app.js?v=10"></script>
</head>
<body>
<main id="home" class="view home">
  <span class="star" style="top:16px;left:24px;color:#7dd3fc">★</span>
  <span class="star" style="top:48px;right:32px">★</span>
  <span class="star" style="top:144px;left:32px">★</span>
  <span class="star" style="top:190px;right:40px;color:#7dd3fc">★</span>

  <!-- COLE AQUI as duas <path> das nuvens do seu arquivo -->
  <svg class="clouds" viewBox="0 0 375 140" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <path d="M-20 60C10 20 70 20 90 50C110 30 170 30 190 60C210 20 280 20 300 50C330 30 380 40 400 80L400 0L-20 0Z" fill="white"/>
<path d="M-10 90C20 60 70 65 90 85C120 55 180 60 200 90C230 65 290 70 310 95C340 75 390 85 400 110L400 0L-10 0Z" fill="white" fill-opacity="0.5"/>
  </svg>

  <header class="home-head">
    <p class="kicker">Venha celebrar conosco</p>
    <h1 data-cfg="eventName">Chá do Lucca</h1>
    <p class="sub" data-cfg="subtitle"></p>
  </header>

  <div class="hero">
  <svg class="balloon" viewBox="0 0 200 220" aria-hidden="true">
          <!-- Balloon Body -->
          <g id="balloon">
            <!-- Central Main Balloons Cluster -->
            <ellipse cx="100" cy="70" rx="38" ry="42" fill="#93C5FD" />
            <ellipse cx="70" cy="75" rx="32" ry="36" fill="#BFDBFE" />
            <ellipse cx="130" cy="75" rx="32" ry="36" fill="#DBEAFE" />
            <ellipse cx="100" cy="50" rx="28" ry="30" fill="#FEF3C7" />
            <ellipse cx="80" cy="55" rx="22" ry="25" fill="#FAF5EF" />
            <ellipse cx="120" cy="55" rx="22" ry="25" fill="#E2E8F0" />
            
            <!-- Stars on Balloon -->
            <path d="M100 40 L102 44 L106 44 L103 47 L104 51 L100 48 L96 51 L97 47 L94 44 L98 44 Z" fill="#D97706" opacity="0.6" />
            <path d="M75 70 L76 72 L79 72 L77 74 L78 77 L75 75 L72 77 L73 74 L71 72 L74 72 Z" fill="#2563EB" opacity="0.5" />
            <path d="M125 70 L126 72 L129 72 L127 74 L128 77 L125 75 L122 77 L123 74 L121 72 L124 72 Z" fill="#2563EB" opacity="0.5" />
          </g>

          <!-- Ropes -->
          <line x1="75" y1="105" x2="82" y2="145" stroke="#A16207" stroke-width="1.5" stroke-dasharray="2,2" />
          <line x1="125" y1="105" x2="118" y2="145" stroke="#A16207" stroke-width="1.5" stroke-dasharray="2,2" />
          <line x1="90" y1="108" x2="88" y2="145" stroke="#A16207" stroke-width="1.2" />
          <line x1="110" y1="108" x2="112" y2="145" stroke="#A16207" stroke-width="1.2" />

          <!-- Basket -->
          <rect x="76" y="145" width="48" height="36" rx="6" fill="#D97706" opacity="0.85" />
          <path d="M76 145 H124 V181 H76 Z" fill="none" stroke="#92400E" stroke-width="2" stroke-linejoin="round" />
          <!-- Woven texture lines -->
          <line x1="76" y1="157" x2="124" y2="157" stroke="#92400E" stroke-width="1" />
          <line x1="76" y1="169" x2="124" y2="169" stroke="#92400E" stroke-width="1" />
          <line x1="92" y1="145" x2="92" y2="181" stroke="#92400E" stroke-width="1" />
          <line x1="108" y1="145" x2="108" y2="181" stroke="#92400E" stroke-width="1" />

          <!-- Teddy Bear -->
          <g id="bear">
            <!-- Ears -->
            <circle cx="85" cy="132" r="8" fill="#B45309" />
            <circle cx="85" cy="132" r="4" fill="#FDE68A" />
            <circle cx="115" cy="132" r="8" fill="#B45309" />
            <circle cx="115" cy="132" r="4" fill="#FDE68A" />
            <!-- Head -->
            <circle cx="100" cy="138" r="18" fill="#D97706" />
            <!-- Muzzle -->
            <ellipse cx="100" cy="142" rx="7" ry="5" fill="#FEF3C7" />
            <!-- Nose & Eyes -->
            <circle cx="100" cy="140" r="2" fill="#1E293B" />
            <circle cx="94" cy="136" r="1.8" fill="#1E293B" />
            <circle cx="106" cy="136" r="1.8" fill="#1E293B" />
            <!-- Paws -->
            <ellipse cx="84" cy="150" rx="5" ry="4" fill="#D97706" />
            <ellipse cx="116" cy="150" rx="5" ry="4" fill="#D97706" />
            <!-- Bowtie -->
            <polygon points="100,146 94,143 94,149" fill="#2563EB" />
            <polygon points="100,146 106,143 106,149" fill="#2563EB" />
            <circle cx="100" cy="146" r="1.5" fill="#1D4ED8" />
          </g>
        </svg>
      
  </div>
 
<div class="badge" id="countBadge" hidden>
  <span class="dot" aria-hidden="true"><i></i><b></b></span>
  <span><strong id="photo-count">0</strong> fotos compartilhadas</span>
</div>

<div class="dock">
  <nav class="actions">
    <button class="btn primary" id="btnCamera">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3 7.2 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3H9Zm3 5.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Zm0 2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Z"/></svg>
      <span>Tirar foto agora</span>
    </button>
    <button class="btn" id="btnPick">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.8"/><path d="m21 16-5-5-9 9"/></svg>
      <span>Escolher da galeria</span>
    </button>
    <a class="link-gallery" href="galeria.html">
      <svg class="ico sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 5v14M18 5v14M2 9h4M18 9h4M2 15h4M18 15h4"/></svg>
      <span>Ver galeria do evento</span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
    </a>
  </nav>
</div>
</main>

  <!-- CAMERA CONTAINER OVERLAY (ESTILO INSTAGRAM STORIES) -->
<section id="camera" class="view camera-container" hidden aria-label="Câmera">
  <div class="viewfinder">
    <video id="video" playsinline muted autoplay></video>
    <img id="camFrame" class="cam-frame" alt="" hidden>
    <div id="camFlash" class="flash-overlay" aria-hidden="true"></div>

    <div class="top-bar">
      <button type="button" class="btn-icon" id="camClose" aria-label="Fechar câmera">✕</button>
      <div class="live-indicator"><span class="live-dot"></span><span>Câmera ao vivo</span></div>
      <span class="spacer" aria-hidden="true"></span>
    </div>

    <div class="bottom-controls">
      <div class="carousel-container">
        <div class="carousel-track" id="camThumbs" role="group" aria-label="Molduras"></div>
      </div>
      <div class="shutter-bar">
        <button type="button" class="gallery-picker-btn" id="camPick" aria-label="Escolher da galeria">🖼️</button>
        <button type="button" id="shutter" class="shutter-btn" aria-label="Tirar foto"><span class="shutter-inner"></span></button>
        <button type="button" class="flip-btn" id="flip" aria-label="Trocar câmera"><span id="flipIcon">🔄</span></button>
      </div>
    </div>
  </div>
</section>

<section id="editor" class="view edit" hidden aria-label="Editor">
  <div class="stage"><canvas id="canvas" aria-label="Prévia da foto com moldura"></canvas></div>
  <div class="panel">
    <p class="label">Escolha sua moldura</p>
    <div id="thumbs" class="thumbs" role="group"></div>
    <div class="row">
      <button class="btn ghost" id="redo">↩ Refazer</button>
      <button class="btn" id="save">💾 Salvar</button>
    </div>
    <button class="btn primary" id="send">💕 Enviar para a galeria</button>
  </div>
</section>

<input type="file" id="file" accept="image/*" hidden>
<div id="busy" class="overlay" hidden role="status" aria-live="polite"><div class="card"><div class="spin"></div><p id="busyMsg"></p><div id="bar" class="bar" hidden><i></i></div></div></div>
<div id="done" class="overlay" hidden role="dialog" aria-modal="true"><div class="card"><p class="big">Foto enviada! 💕</p><a class="btn primary" href="galeria.html">Ver galeria</a><button class="btn ghost" id="doneNew">Tirar outra</button></div></div>
<div id="manual" class="overlay" hidden role="dialog" aria-modal="true"><div class="card"><p>Pressione e segure a foto e escolha <b>Salvar em Fotos</b>.</p><img id="manualImg" alt="Sua foto"><button class="btn" id="manualClose">Fechar</button></div></div>
<div id="toast" class="toast" hidden role="alert"></div>
<script type="module" src="js/app.js?v=2"></script>
</body>
</html>
