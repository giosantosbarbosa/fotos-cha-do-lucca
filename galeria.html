<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galeria — Chá de Bebê</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💕</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=27">
<link rel="stylesheet" href="css/style.css?v=27">
<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "yzf090og19");
</script>
</head>
</head>
<body class="gal">
<header class="ghead"><a class="link back" href="./" aria-label="Voltar ao início"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg><span>Início</span></a><h1 data-cfg="galleryTitle">Galeria</h1></header>
<p id="empty" class="note" hidden>Ainda não há fotos. Seja o primeiro a enviar!</p>
<p id="err" class="note" hidden>Não conseguimos carregar as fotos agora. Verifique sua conexão e tente novamente.</p>
<main id="grid" class="grid"></main>
<button id="more" class="btn ghost more" hidden>Carregar mais</button>

<div id="viewer" class="overlay viewer" hidden role="dialog" aria-modal="true" aria-label="Foto ampliada">
<div class="v-stage" id="vstage"><img id="big" alt="Foto ampliada" draggable="false"></div>
<div class="v-top">
<span class="v-count" id="vcount"></span>
<button type="button" class="v-btn" id="vclose" aria-label="Fechar">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
</button>
</div>
<button type="button" class="v-btn v-nav prev" id="vprev" aria-label="Foto anterior">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
</button>
<button type="button" class="v-btn v-nav next" id="vnext" aria-label="Próxima foto">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
</button>
<div class="v-bottom">
<p id="hint" class="note" hidden>Pressione e segure a foto para salvar.</p>
<div class="v-actions">
<button class="btn" id="vsave">Salvar no celular</button>
<button class="btn" id="vshare" hidden>Compartilhar</button>
</div>
</div>
</div>

<script type="module" src="js/gallery.js?v=12"></script>
</body>
</html>
